# fly.toml app configuration file generated for getlinktink on 2025-11-05T07:51:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'getlinktink'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
